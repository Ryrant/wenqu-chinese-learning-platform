services:
  huawen-zhixing:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/huawen-zhixing.db
      UPLOAD_DIR: /data/uploads
      HUAWEN_ZHIXING_RUNTIME: node
    volumes:
      - huawen-zhixing-data:/data

volumes:
  huawen-zhixing-data:
